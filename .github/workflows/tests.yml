name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'ci/**']
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find public src tests -type f -name '*.js' -print0)
          node --check tests/behavior.test.mjs
          node --check tests/crypto.test.mjs
          node --check tests/csv.test.mjs
          node --check tests/static.test.mjs

      - name: SQLite schema regression tests
        run: python tests/schema.test.py

      - name: Static security and structure tests
        run: node tests/static.test.mjs

      - name: API authorization and isolation tests
        run: node tests/behavior.test.mjs

      - name: Client-side AES-GCM regression tests
        run: node tests/crypto.test.mjs

      - name: CSV formula-injection regression tests
        run: node tests/csv.test.mjs

      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Quality Gate'
            echo
            echo "- Runtime: Node.js ${{ matrix.node }}"
            echo '- Schema, syntax, static, authorization/isolation, crypto and CSV suites were scheduled.'
            echo '- Review the individual step results above for pass/fail details.'
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact declared test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Audit npm dependency tree
        working-directory: tests
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
